[project]
name = "aftermath-drawedumath"
version = "0.1.0"
description = "Follow-up error analysis of VLMs on DrawEduMath"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi>=0.157.0",
    "google-cloud-firestore>=2.34.1",
    "google-genai",
    "huggingface-hub>=2.2.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openai>=2.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code", "."]

[tool.ruff]
line-length = 100
extend-exclude = ["code/aftermath.ipynb", "code/small_labeling_tasks.py"]
